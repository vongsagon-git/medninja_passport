<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Not Found</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;color:#334155}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:48px 32px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
  h1{font-size:64px;font-weight:800;margin:0 0 8px;color:#1e293b;letter-spacing:-2px}
  p{font-size:16px;margin:8px 0 24px;color:#64748b}
  a{display:inline-block;padding:12px 24px;border-radius:10px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(59,130,246,.3);transition:transform .15s}
  a:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>404</h1>
<p>Page not found</p>
<a href="/">Return to home</a>
</div></div>
</body>
</html>
