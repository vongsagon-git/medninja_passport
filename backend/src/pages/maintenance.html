<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>กำลังปรับปรุงระบบ | MedNinja</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e2e8f0;background:#0a0f1c}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 30% 20%,rgba(59,130,246,.18) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(139,92,246,.14) 0%,transparent 60%),#0a0f1c;overflow:hidden;position:relative}
  .brand-top{display:flex;align-items:center;gap:10px;margin-bottom:32px;z-index:2}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(59,130,246,.4)}
  .brand-mark svg{width:22px;height:22px;fill:#fff}
  .brand-name{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;color:#f1f5f9;letter-spacing:-.5px}
  .card{max-width:500px;width:100%;text-align:center;background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,.18);border-radius:24px;padding:52px 40px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;z-index:1}
  .icon{width:96px;height:96px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(59,130,246,.4);animation:pulse 2.5s ease-in-out infinite}
  .icon svg{width:48px;height:48px;fill:#fff;animation:spin 8s linear infinite;transform-origin:center}
  .badge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:#fcd34d;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
  h1{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:800;color:#f1f5f9;margin-bottom:20px;letter-spacing:-.3px;line-height:1.3}
  .message{font-size:16px;line-height:1.85;color:#cbd5e1;margin-bottom:24px;font-weight:400}
  .eta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:#93c5fd;font-size:13px;font-weight:600;margin-top:8px}
  .eta svg{width:14px;height:14px;fill:currentColor}
  .eta:empty{display:none}
  .divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,transparent);margin:24px auto}
  .thanks{margin-top:24px;font-size:13px;color:#64748b}
  .footer{margin-top:24px;font-size:11px;color:#475569;letter-spacing:2px;text-transform:uppercase;font-weight:700}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(59,130,246,.4)}50%{transform:scale(1.04);box-shadow:0 15px 40px rgba(59,130,246,.6)}}
  .glow{position:fixed;width:400px;height:400px;border-radius:50%;pointer-events:none;opacity:.15;filter:blur(80px)}
  .g1{top:-100px;left:-100px;background:#3b82f6}
  .g2{bottom:-100px;right:-100px;background:#8b5cf6}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="brand-top">
  <div class="brand-mark">
    <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5 3.5 9.5 8 10 4.5-.5 8-5 8-10V6l-8-4zm-1 6h2v3h3v2h-3v3h-2v-3H8v-2h3V8z"/></svg>
  </div>
  <div class="brand-name">MedNinja</div>
</div>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </div>

  <div class="badge">SYSTEM UPDATE</div>
  <h1>ระบบกำลังปรับปรุง</h1>

  <div class="message">{{MESSAGE}}</div>

  <div class="eta">
    <svg viewBox="0 0 24 24"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/></svg>
    {{ETA}}
  </div>

  <div class="divider"></div>
  <div class="thanks">ขอบคุณที่รอครับ 🙏</div>
</div>

<div class="footer">MEDNINJA</div>
</body>
</html>
