<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>กำลังปรับปรุงระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,sans-serif;color:#e2e8f0;background:#0a0f1c}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 30% 20%,rgba(59,130,246,.15) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(139,92,246,.12) 0%,transparent 60%),#0a0f1c;overflow:hidden;position:relative}
  .card{max-width:480px;width:100%;text-align:center;background:rgba(30,41,59,.5);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,.15);border-radius:24px;padding:56px 40px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;z-index:1}
  .icon{width:88px;height:88px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(59,130,246,.4);animation:pulse 2s ease-in-out infinite}
  .icon svg{width:44px;height:44px;fill:#fff}
  h1{font-size:24px;font-weight:800;margin-bottom:12px;color:#f1f5f9}
  p{font-size:15px;line-height:1.7;color:#94a3b8;margin-bottom:8px}
  p b{color:#cbd5e1;font-weight:600}
  .divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,transparent);margin:24px auto}
  .note{font-size:13px;color:#64748b;margin-top:16px}
  .brand{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:#334155;letter-spacing:3px;text-transform:uppercase;font-weight:600}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(59,130,246,.4)}50%{transform:scale(1.05);box-shadow:0 15px 40px rgba(59,130,246,.6)}}
  .glow{position:fixed;width:400px;height:400px;border-radius:50%;pointer-events:none;opacity:.1;filter:blur(80px)}
  .g1{top:-100px;left:-100px;background:#3b82f6}
  .g2{bottom:-100px;right:-100px;background:#8b5cf6}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </div>
  <h1>กำลังปรับปรุงระบบ</h1>
  <div class="divider"></div>
  <p>ระบบดูวิดีโอ<b>กำลังปรับปรุงชั่วคราว</b></p>
  <p>กรุณากลับมาใหม่ในอีกสักครู่</p>
  <div class="note">ขอบคุณที่รอครับ 🙏</div>
</div>
<div class="brand">MEDNINJA</div>
</body>
</html>
